[project]
name = "body-telemetry"
version = "0.1.0"
description = "Your own dashboard for what your agent seats do: spend, context, tool use, behaviour and evals. One table, one server, one page. Python standard library only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
body-telemetry = "body_telemetry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/body_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
