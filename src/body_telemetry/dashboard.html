<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>body-telemetry</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --other: #b4b2a9;
  --seq-100: #cde2fb; --seq-200: #9ec5f4; --seq-300: #6da7ec; --seq-400: #3987e5; --seq-500: #256abf; --seq-600: #184f95; --seq-700: #0d366b;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --other: #5f5e59; --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --other: #5f5e59; --accent: #3987e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 16px; padding: 18px 24px 6px; flex-wrap: wrap; }
header h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--ink-2); font-size: 13px; }
header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
nav { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--grid); overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-2); font: inherit;
  padding: 10px 12px; cursor: pointer; white-space: nowrap; }
nav button:hover { color: var(--ink); }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.filters { display: flex; gap: 10px; padding: 12px 24px; flex-wrap: wrap; align-items: end; }
.filters label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
select, input[type=text], input[type=password], button.btn {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--grid);
  border-radius: 6px; padding: 5px 8px; min-width: 0; }
select { max-width: 220px; }
button.btn { cursor: pointer; }
button.btn:hover { background: var(--surface-2); }
.seg { display: inline-flex; border: 1px solid var(--grid); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink-2); padding: 5px 9px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--grid); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
main { padding: 4px 24px 40px; }
main.loading { opacity: .55; transition: opacity .2s; }
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 14px 16px 12px; min-width: 0; grid-column: span 6; }
.card.w12 { grid-column: span 12; } .card.w4 { grid-column: span 4; } .card.w8 { grid-column: span 8; } .card.w3 { grid-column: span 3; }
@media (max-width: 900px) { .card, .card.w4, .card.w8, .card.w3 { grid-column: span 12; } }
.card h2 { font-size: 14px; font-weight: 600; margin: 0; }
.card .note { color: var(--ink-2); font-size: 12px; margin: 2px 0 8px; }
.card .head { display: flex; gap: 8px; align-items: start; }
.card .head .tools { margin-left: auto; display: flex; gap: 6px; }
.card .head .tools button { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px 4px; }
.card .head .tools button:hover { color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 16px; }
.tile .l { color: var(--ink-2); font-size: 12px; }
.tile .v { font-size: 24px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; }
.tile.hero .v { font-size: 48px; line-height: 1.1; }
.tile .d { color: var(--muted); font-size: 12px; }
svg { display: block; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg text.ink { fill: var(--ink-2); }
svg text.strong { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 6px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink-2); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; cursor: default; }
th.sortable { cursor: pointer; } th.sortable:hover { color: var(--ink); }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; max-height: 560px; overflow-y: auto; }
.heat { width: auto; }
.heat th.num { text-align: center; }
.heat td.cell { text-align: center; font-variant-numeric: tabular-nums; border: 2px solid var(--surface); border-radius: 4px; min-width: 110px; padding: 6px 12px; }
.heat td.cell small { display: block; font-size: 10px; opacity: .85; }
.heat th.rowh { position: sticky; left: 0; background: var(--surface); }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.status .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.status i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--ring);
  box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; z-index: 10; display: none; max-width: 320px; }
#tip .t { color: var(--muted); margin-bottom: 4px; }
#tip .r { display: flex; align-items: center; gap: 8px; }
#tip .r b { font-variant-numeric: tabular-nums; min-width: 60px; }
#tip .r i { width: 12px; height: 2px; display: inline-block; flex: none; }
#tip .r span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .lg { font: inherit; color: inherit; background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: 6px; }
.legend button.lg { cursor: pointer; } .legend button.lg:hover { color: var(--ink); text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--grid); border-radius: 999px; padding: 3px 4px 3px 10px; color: var(--ink); }
.chip button { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 5px; font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--ink); }
select.split { font-size: 12px; padding: 2px 4px; }
.drawer-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; justify-content: flex-end; }
.drawer { width: min(640px, 100vw); height: 100%; background: var(--surface); border-left: 1px solid var(--ring); padding: 16px; overflow: auto; box-shadow: -8px 0 24px rgba(0,0,0,.2); }
.drawer .dh { display: flex; gap: 10px; align-items: start; margin-bottom: 6px; }
.drawer .dh > div { flex: 1; min-width: 0; }
.drawer h2 { font-size: 15px; margin: 0; }
.drawer .scroll { max-height: none; }
table.ev tbody tr { cursor: pointer; } table.ev tbody tr:hover { background: var(--surface-2); }
table.ev tr.detail td { white-space: normal; background: var(--surface-2); }
table.ev pre { margin: 0; font-size: 11px; white-space: pre-wrap; word-break: break-all; color: var(--ink-2); }
.keybox { max-width: 420px; margin: 80px auto; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 20px; }
.keybox p { color: var(--ink-2); }
.pivot-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.pivot-controls label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
a { color: var(--accent); }
.filters .fields { display: contents; }
.filters .toggle { display: none; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.live[aria-pressed="true"] i { background: var(--good); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .live[aria-pressed="true"] i { animation: none; } }
.seatlist { display: grid; gap: 10px; }
.seatcard { border: 1px solid var(--grid); border-radius: 10px; padding: 10px 12px; }
.seatcard .top { display: flex; align-items: center; gap: 8px; }
.seatcard .top b { font-size: 15px; }
.seatcard .top .sp { margin-left: auto; font-weight: 600; }
.seatcard .sub { color: var(--ink-2); font-size: 12px; margin: 2px 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seatcard .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.seatcard .nums div { display: flex; flex-direction: column; }
.seatcard .nums span { color: var(--muted); font-size: 11px; }
.seatcard .nums strong { font-weight: 600; font-size: 14px; }
tr.open, .seatcard.open { cursor: pointer; } tr.open:hover { background: var(--surface-2); }
.seathead { display: flex; gap: 14px; align-items: center; margin: 4px 0 14px; }
.seathead h2 { margin: 0; font-size: 20px; display: flex; gap: 10px; align-items: center; }
.seathead .note { color: var(--ink-2); font-size: 13px; }
.pick { position: relative; }
.pickbtn { min-width: 110px; max-width: 220px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop { position: absolute; z-index: 15; top: calc(100% + 4px); left: 0; width: 280px; max-width: calc(100vw - 32px); background: var(--surface);
  border: 1px solid var(--ring); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); padding: 8px; display: grid; gap: 6px; color: var(--ink); }
.pop input[type=text] { width: 100%; }
.popbar { display: flex; gap: 6px; } .popbar .done { margin-left: auto; }
.poplist { max-height: 300px; overflow: auto; }
.poprow { display: flex !important; flex-direction: row !important; align-items: center; gap: 8px; padding: 4px 2px; font-size: 13px !important; color: var(--ink) !important; cursor: pointer; }
.poprow span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.poprow small { color: var(--muted); font-variant-numeric: tabular-nums; }
.poprow .only { font: inherit; font-size: 11px; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0 2px; visibility: hidden; }
.poprow:hover .only, .poprow:focus-within .only { visibility: visible; }
@media (max-width: 700px) { .pickbtn { width: 100%; max-width: none; } .pop { position: fixed; left: 16px; right: 16px; top: 120px; width: auto; } }
.sortbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
@media (max-width: 700px) {
  header, .filters, main { padding-left: 16px; padding-right: 16px; }
  header { padding-top: 12px; gap: 4px 12px; } header .sub { order: 3; width: 100%; font-size: 12px; }
  nav { padding: 0 8px; }
  .filters { align-items: center; }
  .filters .toggle { display: inline-block; }
  .filters .fields { display: none; }
  .filters.open .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .filters.open .fields select { max-width: none; width: 100%; }
  .tiles { grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile.hero { grid-column: span 2; } .tile.hero .v { font-size: 40px; }
  .tile .v { font-size: 20px; }
  .grid { gap: 12px; } .card { padding: 12px; }
  td, th { padding: 6px 6px; }
  nav button { padding: 12px 10px; }
}
</style>
</head>
<body>
<header>
  <h1>body-telemetry</h1>
  <span class="sub" id="span"></span>
  <div class="right">
    <button class="btn live" id="live" title="Refresh every 20 seconds"><i></i>Live</button>
    <button class="btn" id="theme" title="Light or dark">Theme</button>
  </div>
</header>
<nav id="tabs" role="tablist"></nav>
<div class="filters" id="filters"></div>
<main id="main"><div class="empty">Reading the store…</div></main>
<div id="tip"></div>
<script>
"use strict";
// ---------- small helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const SVG = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent, text) {
  const svgTags = ["svg", "g", "path", "line", "rect", "circle", "text", "polyline", "defs", "marker"];
  const e = svgTags.includes(tag) ? document.createElementNS(SVG, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const SLOTS = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const NONE = "(none)";
// a label as charts show it: a model without its provider prefix
// a label cut to the room it has (11px text runs about 6.3px a character)
const fit = (text, px) => { const n = Math.max(5, Math.floor(px / 6.3)); return text.length > n ? text.slice(0, n - 1) + "…" : text; };
const short = v => String(v ?? NONE).replace(/^[a-z0-9_-]+:(?=[^/]+\/)/i, "");

function compact(v) {
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(a >= 1e10 ? 0 : 1) + "B";
  if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";
  if (a >= 1e3) return (v / 1e3).toFixed(a >= 1e4 ? 0 : 1) + "K";
  if (a >= 100 || Number.isInteger(v)) return String(Math.round(v));
  if (a >= 10) return v.toFixed(1);
  return v.toPrecision(2).replace(/\.?0+$/, "");
}
function fmt(v, unit) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  if (unit === "usd") {
    const a = Math.abs(v);
    if (a === 0) return "$0";
    if (a >= 100) return "$" + compact(v);
    if (a >= 1) return "$" + v.toFixed(2);
    if (a >= 0.01) return "$" + v.toFixed(3);
    return "$" + String(Number(v.toPrecision(2)));
  }
  if (unit === "share") return (v * 100).toFixed(v >= 0.1 || v === 0 ? 0 : 1) + "%";
  if (unit === "seconds") return v >= 60 ? (v / 60).toFixed(1) + "m" : v >= 10 ? v.toFixed(0) + "s" : v.toFixed(1) + "s";
  return compact(v);
}
function niceTicks(max, n = 4) {
  if (!(max > 0)) return [0, 1];
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = [];
  for (let t = 0; t <= max + step * 0.001; t += step) out.push(+t.toPrecision(12));
  if (out[out.length - 1] < max) out.push(+(out[out.length - 1] + step).toPrecision(12));
  return out;
}
function ago(ts) {
  if (!ts) return "–";
  const s = Date.now() / 1000 - ts;
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 172800) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
const dt = (ts, withDate) => new Date(ts * 1000).toLocaleString([], withDate ?
  { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" } : { hour: "2-digit", minute: "2-digit" });

// ---------- tooltip ----------
const tip = $("#tip");
function showTip(ev, title, rows) {
  tip.replaceChildren();
  if (title) el("div", { class: "t" }, tip, title);
  for (const r of rows) {
    const row = el("div", { class: "r" }, tip);
    if (r.color) el("i", { style: `background:${r.color}` }, row);
    el("b", {}, row, r.value);
    el("span", {}, row, r.label || "");
  }
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.style.display = "none"; };

// ---------- colour: follows the entity, never its rank ----------
// Each label's values get slots in the order of their counts over the whole store (from /v1/meta), so a filter
// never repaints a series. Past seven, a value folds into "other".
const colorMaps = {};
function colorOf(dim, value) {
  if (value === "other" || value === NONE) return css("--other");
  const order = colorMaps[dim] || (colorMaps[dim] = (META.values[dim] || []).map(v => String(v[0])));
  let i = order.indexOf(String(value));
  if (i < 0) { order.push(String(value)); i = order.length - 1; }
  return i < 7 ? css(SLOTS[i]) : css("--other");
}
// The series a chart shows: the top values by total, keeping slot order stable, the rest folded into "other".
function topSeries(rows, dim, k = 7) {
  const tot = {};
  for (const r of rows) tot[r[dim]] = (tot[r[dim]] || 0) + Math.abs(r.value || 0);
  const keys = Object.keys(tot).sort((a, b) => tot[b] - tot[a]);
  return { keep: new Set(keys.slice(0, k)), more: keys.length > k };
}

// ---------- api ----------
let KEY = "";
try { KEY = localStorage.getItem("bt-key") || ""; } catch (e) {}
async function api(path, params = {}) {
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== "") qs.set(k, v);
  const r = await fetch(path + (qs.toString() ? "?" + qs : ""), { headers: KEY ? { Authorization: "Bearer " + KEY } : {} });
  if (r.status === 401) { askKey(); throw new Error("key"); }
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function askKey() {
  const m = $("#main"); m.replaceChildren();
  const box = el("div", { class: "keybox" }, m);
  el("h2", {}, box, "This server needs a key");
  el("p", {}, box, "Paste the key it was started with. It is kept in this browser only.");
  const inp = el("input", { type: "password", style: "width:100%" }, box);
  const b = el("button", { class: "btn", style: "margin-top:10px" }, box, "Use this key");
  b.onclick = () => { KEY = inp.value.trim(); try { localStorage.setItem("bt-key", KEY); } catch (e) {} boot(); };
}

// ---------- state ----------
let META = null;
// Filters scope every chart. The six labels have dropdowns; any other label (a tool, a variant, a layer) is added by
// clicking a mark and shows as a chip. A dragged time range is range "custom" with from and to.
const DIMF = ["world", "seat", "model", "run", "source", "machine"];
const F = { range: "all", from: "", to: "", world: "", seat: "", model: "", run: "", source: "", machine: "", more: {} };
const RANGES = [["all", "All"], ["24h", "24h"], ["7d", "7 days"], ["30d", "30 days"]];
const VIEWS = [["seats", "Seats"], ["spend", "Spend"], ["context", "Context"], ["actions", "Action space"],
  ["flow", "Flow"], ["behavior", "Behavior"], ["helpers", "Helpers"], ["evals", "Evals"], ["pivot", "Pivot"]];
// the seat page has no tab of its own; it shows one while it is open
const HIDDEN = [["seat", "Seat"]];
let VIEW = "seats";
try { const s = JSON.parse(localStorage.getItem("bt-state") || "{}"); Object.assign(F, s.F || {}); F.more = F.more || {}; VIEW = s.view || VIEW; } catch (e) {}
// A link can name the view and the filters: #evals?run=grid/20261126-120000&model=...
function fromHash() {
  const [v, qs] = location.hash.slice(1).split("?");
  if (!VIEWS.concat(HIDDEN).some(x => x[0] === v)) return false;
  VIEW = v;

const SPLITS = ["model", "seat", "world", "switches", "run", "variant", "maker", "source"];
async function chartCard(grid, title, note, w, measure, kind, dim, opts = {}) {
  const c = card(grid, title, note, w);
  c.setEvents(measure, opts.params || {});
  let res = null;
  const draw = async (d) => {
    const p = { ...(opts.params || {}) };
    if (kind === "line") { p.bucket = autoBucket(); if (d) p.by = d; }
    else if (kind === "stack") p.by = d + "," + opts.part;
    else if (d) p.by = d;
    res = await Q(measure, p);
    if (opts.several && res.rows.filter(r => r.value !== null).length < 2) { c.remove(); return; }
    c.body.replaceChildren();
    if (kind === "line") lineChart(c.body, res, d, opts);
    else if (kind === "stack") stackChart(c.body, res, d, opts.part, opts);
    else barChart(c.body, res, d, opts);
    dim = d;
  };
  try {
    await draw(dim);
    c.setTable(() => qtable(res, (kind === "stack" ? [dim, opts.part] : dim ? [dim] : [])));
    if (kind === "line" && opts.split !== false) {
      // the chart's own split: the same measure by another label, without leaving the view
      const sel = el("select", { class: "split", title: "Split by" });
      c.tools.prepend(sel);
      const keyName = "bt-split-" + title;
      for (const d of [""].concat(SPLITS.filter(x => (META.values[x] || []).length > 1)))
        el("option", { value: d }, sel, d ? "by " + d : "total");
      sel.value = dim || "";
      try {
        const k = localStorage.getItem(keyName);
        if (k !== null && [...sel.options].some(o => o.value === k) && k !== sel.value) { sel.value = k; await draw(k || null); }
      } catch (e) {}
      sel.onchange = async () => {
        try { localStorage.setItem(keyName, sel.value); } catch (e) {}
        c.body.style.opacity = .55; await draw(sel.value || null); c.body.style.opacity = 1;
      };
    }
  } catch (e) { if (e.message !== "key") empty(c.body, "Could not load: " + e.message); }
  return c;
}

const COLS = {
  model_call: ["model", "use", "input_tokens", "cached_tokens", "output_tokens", "cost", "seconds"],
  tool_call: ["tool", "layer", "verb", "ok", "code", "out_chars", "secs"],
  turn: ["turn", "model", "steps", "tool_calls", "deeds", "says", "reads", "nudges", "ended", "cost"],
  eval_sample: ["case", "variant", "scene", "sample", "model", "passed", "trials", "cost"],
  invented: ["model", "tool", "read_as"], reflex: ["trigger", "outcome", "rules", "secs"], tell: ["event", "out_chars"],
  seat: ["event", "model"], setup: ["model"], behavior: ["case", "variant", "sample", "model"],
};
async function inspect(title, measure, params) {
  const back = el("div", { class: "drawer-back" }, document.body);
  const d = el("aside", { class: "drawer", role: "dialog", "aria-label": "Events" }, back);
  const esc = ev => { if (ev.key === "Escape") close(); };
  const close = () => { back.remove(); removeEventListener("keydown", esc); };
  addEventListener("keydown", esc);
  back.addEventListener("click", ev => { if (ev.target === back) close(); });
  const head = el("div", { class: "dh" }, d);
  const t = el("div", {}, head);
  el("h2", {}, t, "Events behind: " + title);
  const sub = el("div", { class: "note" }, t, "Loading…");
  el("button", { class: "btn" }, head, "Close").onclick = close;
  const scope = Object.entries(filt(params));
  if (scope.length) el("div", { class: "note" }, d, scope.map(([k, v]) => `${k} = ${v}`).join("  ·  "));
  const list = el("div", { class: "scroll" }, d);
  const more = el("button", { class: "btn", style: "margin-top:10px;display:none" }, d, "Older");
  let before = "", shown = 0, cols = null, tb = null;
  const load = async () => {
    const r = await api("/v1/events", filt({ ...params, measure, limit: 100, before }));
    sub.textContent = `${compact(r.total)} events in this slice, newest first. Click a row for all its fields.`;
    if (!tb) {
      const table = el("table", { class: "ev" }, list);
      const hr = el("tr", {}, el("thead", {}, table));
      const kinds = new Set(r.rows.map(x => x.kind));
      cols = ["ts", "kind", "seat"].concat(kinds.size === 1 ? (COLS[[...kinds][0]] || []) : ["model", "tool", "cost"]);
      for (const c of cols) el("th", {}, hr, c === "ts" ? "time" : c);
      tb = el("tbody", {}, table);
    }
    for (const row of r.rows) {
      const tr = el("tr", { tabindex: 0 }, tb);
      for (const c of cols) {
        let v = row[c];
        if (c === "ts") v = new Date(v * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
        else if (c === "cost") v = v === undefined ? "–" : fmt(v, "usd");
        else if (c === "ok" || c === "passed") v = v === undefined ? "–" : v ? "yes" : "no";
        else if (c === "model") v = v ? short(v) : "–";
        else if (typeof v === "number") v = compact(v);
        el("td", { class: typeof row[c] === "number" && c !== "ts" ? "num" : "" }, tr, v ?? "–");
      }
      const open = () => {
        if (tr.nextSibling && tr.nextSibling.classList.contains("detail")) { tr.nextSibling.remove(); return; }
        const dtr = el("tr", { class: "detail" });
        el("pre", {}, el("td", { colspan: cols.length }, dtr), JSON.stringify(row, null, 1));
        tr.after(dtr);
      };
      tr.onclick = open;
      tr.onkeydown = ev => { if (ev.key === "Enter") open(); };
    }
    shown += r.rows.length;
    if (r.rows.length) before = r.rows[r.rows.length - 1].ts;
    more.style.display = shown < r.total && r.rows.length ? "inline-block" : "none";
    if (!shown) empty(list, "No events in this slice.");
  };
  more.onclick = () => load().catch(() => {});
  try { await load(); } catch (e) { sub.textContent = "Could not load: " + e.message; }
}

    el("text", { x: p.x + 12, y: p.y + 36, class: "ink" }, ng, fit(String(words || id), BW - 18));
    const fired = (g.fired || {})[id];
    if (fired) el("text", { x: p.x + BW - 8, y: p.y + 18, "text-anchor": "end" }, ng, `×${fired}`);
    if (id === g.start) el("text", { x: p.x, y: p.y - 5, "font-size": 10 }, ng, "start");
    const hit = el("rect", { x: p.x, y: p.y, width: BW, height: BH, fill: "transparent" }, ng);
    hit.addEventListener("pointermove", ev => showTip(ev, `${id} · ${n.kind}`, [
      ...Object.entries(n).filter(([k]) => k !== "kind" && !GEDGES.includes(k) && k !== "options").map(([k, v]) => ({ value: k, label: typeof v === "object" ? JSON.stringify(v) : String(v) })),
      ...graphEdges(n).map(([k, t]) => ({ value: k + " →", label: t })),
      ...(fired ? [{ value: String(fired), label: "times this node was reached" }] : [])]));
    hit.addEventListener("pointerleave", hideTip);
  }
}
// A list of graphs; clicking one draws it underneath.
function graphList(parent, rows, opts = {}) {
  if (!rows.length) return empty(parent, opts.none || "No behavior graphs in this slice.");
  const view = el("div", { style: "margin-top:12px" });
  const cols = [{ key: "ts", label: "time", fmt: v => dt(v, true) }]
    .concat(rows.some(r => r.case) ? [{ key: "case", label: "case" }, { key: "variant", label: "variant" }, { key: "sample", label: "sample", num: true }] : [{ key: "character", label: "character" }])
    .concat([{ key: "model", label: "model", fmt: v => short(v) }, { key: "nodes", label: "nodes", num: true },
      { key: "kinds", label: "kinds", fmt: v => Object.entries(v || {}).map(([k, n]) => `${n} ${k}`).join(", ") },
      { key: "passed", label: "score", num: true, fmt: (v, r) => r.trials ? `${v} of ${r.trials}` : "–" }]);
  const wrap = el("div", { class: "scroll", style: "max-height:300px" }, parent);
  const t = el("table", { class: "ev" }, wrap);
  const hr = el("tr", {}, el("thead", {}, t));
  for (const c of cols) el("th", { class: c.num ? "num" : "" }, hr, c.label);
  const tb = el("tbody", {}, t);
  let sel = null;
  const pick = (r, tr) => {
    if (sel) sel.style.background = "";
    sel = tr; tr.style.background = css("--surface-2");
    view.replaceChildren();
    el("div", { class: "note" }, view, [r.case, r.variant, r.model && short(r.model), r.trials ? `scored ${r.passed} of ${r.trials} wakes` : null].filter(Boolean).join(" · ") +
      (Object.values(r.graph.nodes || {}).some(n => n.if || n.q || n.text) ? "" : " · shape only: node names and words stay home at detail counts"));
    drawGraph(view, r.graph);
  };
  rows.forEach((r, i) => {
    const tr = el("tr", { tabindex: 0 }, tb);
    for (const c of cols) el("td", { class: c.num ? "num" : "" }, tr, c.fmt ? c.fmt(r[c.key], r) : (r[c.key] ?? "–"));
    tr.onclick = () => pick(r, tr);
    tr.onkeydown = ev => { if (ev.key === "Enter") pick(r, tr); };
    if (i === 0) pick(r, tr);
  });
  parent.appendChild(view);
}

// ---------- one seat close up ----------
V.seat = async (m) => {
  if (!F.seat || F.seat.includes(",")) { VIEW = "seats"; save(); drawTabs(); return V.seats(m); }
  const d = await api("/v1/seat", { seat: F.seat, machine: F.machine, run: F.run });
  // an eval run can hold seats of the same name: without a run picked, this page is the seat's live play
  const live = F.run ? {} : { run: NONE };
  const s = d.seat || { seat: F.seat };
  const head = el("div", { class: "seathead" }, m);
  const back = el("button", { class: "btn" }, head, "← All seats");
  back.onclick = () => { F.seat = ""; VIEW = "seats"; save(); drawTabs(); drawFilters(); render(); };
  const who = el("div", {}, head);
  const h = el("h2", {}, who, s.character || s.seat);
  if (d.seat) statusOf(h, s);
  el("div", { class: "note" }, who, [s.seat, s.world, s.role, s.model && short(s.model), s.version && "harness " + s.version].filter(Boolean).join(" · "));
  tiles(m, [{ label: "Spend", value: fmt(s.spend || 0, "usd"), hero: true, d: fmt(s.spend_24h || 0, "usd") + " in the last 24h" },
    { label: "Turns", value: compact(s.turns || 0), d: "last wake " + ago(s.last_wake) },
    { label: "Deeds", value: compact(s.deeds || 0) },
    { label: "Refused", value: s.tool_calls ? fmt((s.refusals || 0) / s.tool_calls, "share") : "–", d: `${compact(s.refusals || 0)} of ${compact(s.tool_calls || 0)} calls` },
    { label: "Input per call", value: s.input_p50 ? compact(s.input_p50) : "–", d: "median tokens" }]);
  const g = el("div", { class: "grid" }, m);
  const sc = card(g, "Setup", d.setup_ts ? `As of ${dt(d.setup_ts, true)}` + (d.setup_changes ? `; changed ${d.setup_changes} time${d.setup_changes > 1 ? "s" : ""} before` : "") + ". Switches, numbers and models only." : "No setup recorded yet: import the seat's folder, or update the sender.", "");
  const keys = Object.keys(d.setup).sort((a, b) => (typeof d.setup[a] === "boolean") - (typeof d.setup[b] === "boolean") || a.localeCompare(b));
  if (keys.length) sc.body.appendChild(tableOf([{ key: "k", label: "setting" }, { key: "v", label: "value", fmt: v => typeof v === "boolean" ? (v ? "on" : "off") : Array.isArray(v) ? v.map(short).join(", ") : typeof v === "string" ? short(v) : String(v) }],
    keys.map(k => ({ k, v: d.setup[k] }))));
  const hc = card(g, "Helpers", "What this seat has on, and how often it used each, per 100 turns.", "");
  hc.body.appendChild(tableOf([{ key: "name", label: "helper" }, { key: "on", label: "on", fmt: v => v === null ? "–" : v ? "on" : "off" },
    { key: "uses", label: "uses", num: true, fmt: compact }, { key: "per_100_turns", label: "per 100 turns", num: true, fmt: per100 }, { key: "unit", label: "counted as" }], d.helpers));
  const gc = card(g, "Behavior graphs", "The programs this seat wrote for its body to run while it sleeps, newest first.", "w12");
  graphList(gc.body, d.graphs, { none: "This seat has not written a behavior graph, or the sender does not send them yet." });
  const fc = card(g, "What it does in a turn", "Its tool calls from the start of each turn. Open Flow for more.", "w12");
  try { sankey(fc.body, await api("/v1/flow", filt({ depth: 4, top: 6, ...live })), { height: 260 }); } catch (e) { empty(fc.body); }
  await Promise.all([
    chartCard(g, "Spend over time", null, "w12", "spend", "line", null, { split: false, params: live }),
    chartCard(g, "Most used tools", null, "", "tool_calls", "bar", "tool", { max: 10, params: live }),
    chartCard(g, "How turns ended", null, "", "turns", "bar", "ended", { params: live }),
  ]);
};

const PIV = { measure: "spend", by: "model", split: "", bucket: "none", chart: "auto" };
try { Object.assign(PIV, JSON.parse(localStorage.getItem("bt-pivot") || "{}")); } catch (e) {}
V.pivot = async (m) => {
  const box = el("div", { class: "pivot-controls" }, m);
  const dims = [""].concat(Object.keys(META.values).filter(d => d !== "kind" || true)).concat(META.switches.map(s => "sw." + s));
  const sel = (label, key, options) => {
    const l = el("label", {}, box, label);
    const s = el("select", {}, l);
    for (const [v, t] of options) el("option", { value: v }, s, t);
    s.value = PIV[key];
    s.onchange = () => { PIV[key] = s.value; try { localStorage.setItem("bt-pivot", JSON.stringify(PIV)); } catch (e) {} render(); };
  };
  const ms = Object.entries(META.measures).map(([k, v]) => [k, `${v.label} (${v.kind || "any"})`]);
  for (const agg of ["sum", "avg", "p50", "p95", "max"]) for (const n of META.numbers) ms.push([`${agg}:${n}`, `${agg} of ${n}`]);
  sel("Measure", "measure", ms);
  sel("Group by", "by", dims.filter(Boolean).map(d => [d, d]));
  sel("Split by", "split", dims.map(d => [d, d || "(nothing)"]));
  sel("Over time", "bucket", [["none", "no"], ["auto", "yes"]]);
  const custom = el("label", {}, box, "Extra filter (label=value)");
  const inp = el("input", { type: "text", placeholder: "tool=act", value: PIV.extra || "" }, custom);
  inp.onchange = () => { PIV.extra = inp.value.trim(); try { localStorage.setItem("bt-pivot", JSON.stringify(PIV)); } catch (e) {} render(); };
  const g = el("div", { class: "grid" }, m);
  const meas = META.measures[PIV.measure] || { label: PIV.measure };
  const c = card(g, `${meas.label} by ${PIV.by}${PIV.split ? " and " + PIV.split : ""}`, meas.kind ? `Counts ${meas.kind} events.` : "Over every kind of event; add kind=... to narrow it.", "w12");
  const extra = {};
  if (PIV.extra) for (const part of PIV.extra.split("&")) { const [k, v] = part.split("="); if (k && v) extra[k.trim()] = v.trim(); }
  c.setEvents(PIV.measure, extra);
  try {
    if (PIV.bucket === "auto") {
      const res = await Q(PIV.measure, { bucket: autoBucket(), by: PIV.by, ...extra });
      lineChart(c.body, res, PIV.by, { zero: res.type === "value" });
      c.setTable(() => qtable(res, [PIV.by]));
    } else if (PIV.split) {
      const res = await Q(PIV.measure, { by: PIV.by + "," + PIV.split, ...extra });
      if (res.type === "share") heatTable(c.body, res, PIV.by, PIV.split);
      else stackChart(c.body, res, PIV.by, PIV.split, { max: 20 });
      c.setTable(() => qtable(res, [PIV.by, PIV.split]));
    } else {
      const res = await Q(PIV.measure, { by: PIV.by, ...extra });
      barChart(c.body, res, PIV.by, { ci: res.type === "share", max: 30, full: res.unit === "share" });
      c.setTable(() => qtable(res, [PIV.by]));
    }
  } catch (e) { if (e.message !== "key") empty(c.body, "Could not load: " + e.message); }
};

// ---------- frame ----------
function drawFilters() {
  const f = $("#filters"); f.replaceChildren();
  const rl = el("label", {}, f, "Time");
  const seg = el("div", { class: "seg" }, rl);
  for (const [v, t] of RANGES) {
    const b = el("button", { "aria-pressed": F.range === v }, seg, t);
    b.onclick = () => { F.range = v; F.from = F.to = ""; save(); drawFilters(); render(); };
  }
  const set = DIMF.filter(k => F[k]).length + Object.keys(F.more).length + (F.range === "custom" ? 1 : 0);
  const tg = el("button", { class: "btn toggle", "aria-expanded": f.classList.contains("open") }, f, set ? `Filters · ${set}` : "Filters");
  tg.onclick = () => { f.classList.toggle("open"); tg.setAttribute("aria-expanded", f.classList.contains("open")); };
  const fields = el("div", { class: "fields" }, f);
  for (const [k, label] of [["world", "World"], ["seat", "Seat"], ["model", "Model"], ["run", "Eval run"], ["source", "Source"], ["machine", "Machine"]]) {
    const vals = META.values[k] || [];
    if (!vals.length && !F[k]) continue;
    if (MULTI.includes(k)) { pickMany(el("label", {}, fields, label), k, vals); continue; }
    const l = el("label", {}, fields, label);
    const s = el("select", {}, l);
    el("option", { value: "" }, s, "All");
    if (k === "run") el("option", { value: NONE }, s, "No run (live play)");
    for (const [v, n] of vals) el("option", { value: v }, s, `${k === "model" ? String(v).replace(/^[^:]*:/, "") : v} (${compact(n)})`);
    s.value = F[k];
    s.onchange = () => { F[k] = s.value; save(); drawFilters(); render(); };
  }
  const chips = el("div", { class: "chips" }, f);
  const chip = (label, onx) => {
    const c = el("span", { class: "chip" }, chips, label);
    el("button", { "aria-label": "Remove " + label, title: "Remove" }, c, "×").onclick = onx;
  };
  if (F.range === "custom") chip(`${dt(+F.from, true)} to ${dt(+F.to, true)}`, () => setRange(null));
  for (const [k, v] of Object.entries(F.more)) chip(`${k} = ${short(v)}`, () => { delete F.more[k]; save(); drawFilters(); render(); });
  if (set) {
    const b = el("button", { class: "btn" }, fields, "Clear all");
    b.onclick = () => { for (const k of ["from", "to", ...DIMF]) F[k] = ""; F.range = "all"; F.more = {}; save(); drawFilters(); render(); };
  }
}
// A checklist for a label: tick a set of values (a group), search them, or pick one alone. Applied when it closes.
const MULTI = ["world", "seat", "model"];
function pickMany(parent, k, vals) {
  const name = v => k === "model" ? short(v) : String(v);
  const cur = () => F[k] ? F[k].split(",") : [];
  const wrap = el("div", { class: "pick" }, parent);
  const n = cur().length;
  const b = el("button", { class: "btn pickbtn", "aria-haspopup": "true", "aria-expanded": "false" }, wrap,
    n === 0 ? "All" : n === 1 ? name(cur()[0]) : `${n} ${k === "seat" ? "seats" : k + "s"}`);
  b.onclick = ev => {
    ev.preventDefault();
    if (wrap.querySelector(".pop")) return;
    b.setAttribute("aria-expanded", "true");
    const chosen = new Set(cur());
    const pop = el("div", { class: "pop", role: "dialog" }, wrap);
    const q = el("input", { type: "text", placeholder: "Search", "aria-label": "Search " + k }, pop);
    const bar = el("div", { class: "popbar" }, pop);
    const list = el("div", { class: "poplist" }, pop);
    let shown = [];
    const draw = () => {
      list.replaceChildren(); shown = [];
      const f = q.value.trim().toLowerCase();
      for (const [v, c] of vals.slice(0, 400)) {
        if (f && !String(v).toLowerCase().includes(f)) continue;
        shown.push(String(v));
        const row = el("label", { class: "poprow" }, list);
        const cb = el("input", { type: "checkbox" }, row);
        cb.checked = chosen.has(String(v));
        cb.onchange = () => { cb.checked ? chosen.add(String(v)) : chosen.delete(String(v)); };
        el("span", {}, row, name(v));
        el("small", {}, row, compact(c));
        const only = el("button", { class: "only", title: "Only this one" }, row, "only");
        only.onclick = e => { e.preventDefault(); chosen.clear(); chosen.add(String(v)); close(); };
      }
    };
    el("button", { class: "btn" }, bar, "All").onclick = e => { e.preventDefault(); chosen.clear(); draw(); };
    el("button", { class: "btn", title: "Tick every value the search shows" }, bar, "Tick shown").onclick = e => { e.preventDefault(); for (const v of shown) chosen.add(v); draw(); };
    el("button", { class: "btn done" }, bar, "Done").onclick = e => { e.preventDefault(); close(); };
    q.oninput = draw;
    const outside = e => { if (!wrap.contains(e.target)) close(); };
    const esc = e => { if (e.key === "Escape") close(); };
    const close = () => {
      removeEventListener("pointerdown", outside); removeEventListener("keydown", esc);
      pop.remove(); b.setAttribute("aria-expanded", "false");
      const next = [...chosen].join(",");
      if (next !== F[k]) { F[k] = next; save(); drawFilters(); render(); }
    };
    setTimeout(() => addEventListener("pointerdown", outside));
    addEventListener("keydown", esc);
    draw(); q.focus();
  };
}
function drawTabs() {
  const t = $("#tabs"); t.replaceChildren();
  for (const [k, label] of VIEWS.concat(VIEW === "seat" ? [["seat", "Seat: " + F.seat]] : [])) {
    const b = el("button", { role: "tab", "aria-selected": VIEW === k }, t, label);
    b.onclick = () => { VIEW = k; save(); drawTabs(); render(); scrollTo(0, 0); };
  }
}
let renderId = 0;
async function render() {
  const id = ++renderId, m = $("#main");
  m.classList.add("loading");
  // the new view is drawn hidden at the page's width (charts measure their card), while the old one stays shown
  const fresh = el("div", { style: `position:absolute;visibility:hidden;left:0;width:${m.clientWidth}px;padding:inherit` }, document.body);
  fresh.style.padding = getComputedStyle(m).padding;
  try { await V[VIEW](fresh); } catch (e) { if (e.message !== "key") empty(fresh, "Could not load: " + e.message); }
  fresh.remove();
  if (id !== renderId) return;
  // a half-width card left alone on its row takes the whole row
  for (const g of fresh.querySelectorAll(".grid")) {
    const half = [...g.children].filter(c => c.classList.contains("card") && !/\bw(12|8|4|3)\b/.test(c.className));
    if (half.length % 2) half[half.length - 1].classList.add("w12");
  }
  m.replaceChildren(...fresh.childNodes);
  m.classList.remove("loading");
}
async function boot() {
  try { META = await api("/v1/meta"); } catch (e) { if (e.message !== "key") $("#main").textContent = "Could not reach the server: " + e.message; return; }
  drawSpan(); drawTabs(); drawFilters(); save(); render();
}
function drawSpan() {
  $("#span").textContent = META.rows ? `${compact(META.rows)} events · last one ${ago(META.to)}` +
    (META.taken ? ` · ${compact(META.taken)} posted since the server started` : "") : "no events yet: post some, or run body-telemetry import";
}
// Live: every 20 seconds, while the page is in view, read what arrived and draw the view again
let LIVE = true;
try { LIVE = localStorage.getItem("bt-live") !== "0"; } catch (e) {}
const liveBtn = $("#live");
liveBtn.setAttribute("aria-pressed", LIVE);
liveBtn.onclick = () => { LIVE = !LIVE; liveBtn.setAttribute("aria-pressed", LIVE); try { localStorage.setItem("bt-live", LIVE ? "1" : "0"); } catch (e) {} };
setInterval(async () => {
  if (!LIVE || document.visibilityState !== "visible" || !META || tip.style.display === "block") return;
  try { const m = await api("/v1/meta"); const grew = m.rows !== META.rows; META = m; drawSpan(); if (grew) render(); } catch (e) {}
}, 20000);
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("bt-theme", document.documentElement.dataset.theme); } catch (e) {}
  render();
};
try { const th = localStorage.getItem("bt-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
let rz, lastW = innerWidth; addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(render, 200); });
boot();
</script>
